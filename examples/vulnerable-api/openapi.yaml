# OpenAPI spec for the vulnerable demo API's resources (login is auth, in config).
openapi: "3.0.0"
info:
  title: WrongDoor vulnerable demo API
  version: "1.0"
paths:
  /invoices:
    post:
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceIn"
      responses:
        "201":
          description: created
  /invoices/{invoice_id}:
    get:
      operationId: getInvoice
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ok
    delete:
      operationId: deleteInvoice
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: deleted
  /documents:
    post:
      operationId: createDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentIn"
      responses:
        "201":
          description: created
  /documents/{document_id}:
    get:
      operationId: getDocument
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ok
  /notes:
    post:
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteIn"
      responses:
        "201":
          description: created
  /notes/{note_id}:
    get:
      operationId: getNote
      parameters:
        - name: note_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ok
    delete:
      operationId: deleteNote
      parameters:
        - name: note_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: deleted
  /admin/all-invoices:
    get:
      operationId: getAllInvoices
      responses:
        "200":
          description: ok
  /admin/all-users:
    get:
      operationId: getAllUsers
      responses:
        "200":
          description: ok
  /orgs:
    post:
      operationId: createOrg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgIn"
      responses:
        "201":
          description: created
  /orgs/{org_id}:
    delete:
      operationId: deleteOrg
      parameters:
        - name: org_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: deleted
  /projects:
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectIn"
      responses:
        "201":
          description: created
  /projects/{project_id}:
    get:
      operationId: getProject
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ok
    delete:
      operationId: deleteProject
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: deleted
components:
  schemas:
    InvoiceIn:
      type: object
      properties:
        amount:
          type: number
        memo:
          type: string
      required: [amount]
    DocumentIn:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
      required: [title]
    NoteIn:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
      required: [title]
    OrgIn:
      type: object
      properties:
        name:
          type: string
    ProjectIn:
      type: object
      properties:
        org_id:
          type: integer
        name:
          type: string
      required: [org_id]
