# OpenAPI spec for the throwaway toy API's resources (examples/scratch/toy_api.py).
# Describes only the invoice resource (the /login endpoint is auth, configured
# in config.yaml, not a resource to seed). Hand-written 3.0.0 for a controlled test.
openapi: "3.0.0"
info:
  title: WrongDoor toy API
  version: "1.0"
paths:
  /invoices:
    post:
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceIn"
      responses:
        "201":
          description: created
  /invoices/{invoice_id}:
    get:
      operationId: getInvoice
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: ok
components:
  schemas:
    InvoiceIn:
      type: object
      properties:
        amount:
          type: number
        memo:
          type: string
      required: [amount]
